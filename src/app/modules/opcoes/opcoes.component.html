<div class="grid alow">
  <div
    [routerLink]="['/separacao']"
    class="xl:col-6 col-12 p-0 cursor-pointer"
    style="
      background-repeat: no-repeat;
      background-size: cover;
      background-position: right;
      background-image: url('https://www.grupotpc.com/wp-content/uploads/2022/07/separacao-de-produtos.jpg');
    "
  >
    <div
      class="flex h-screen spacing align-items-center"
      style="background-color: #00380161"
    >
      <div class="teste">
        <h1 class="title mb-3">Separação</h1>
        <span>Separação dos produtos para a expedição</span>
      </div>
    </div>
  </div>
  <div
    [routerLink]="['/conferencia']"
    class="xl:col-6 col-12 p-0 cursor-pointer"
    style="
      background-repeat: no-repeat;
      background-size: cover;
      background-position: right;
      background-image: url('https://goroger.com.br/wp-content/uploads/2023/04/como-fazer-um-inventario-de-estoque.jpg');
    "
  >
    <div
      class="flex flex-column h-screen spacing justify-content-center align-items-end"
      style="background-color: #56565661"
    >
      <h1 class="text-right mb-3 title">Conferência</h1>
      <span>Conferência dos produtos antes da liberação</span>
    </div>
  </div>
  <div
    [routerLink]="['/pedidos']"
    class="xl:col-12 col-12 p-0 cursor-pointer"
    style="
      background-repeat: no-repeat;
      background-size: cover;
      background-position: right;
      background-image: url('https://images.pexels.com/photos/3938023/pexels-photo-3938023.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
    "
  >
    <div
      class="flex flex-column h-screen spacing justify-content-center align-items-end"
      style="background-color: #56565661"
    >
      <h1 class="text-right mb-3 title">Pedidos (Teste MVP)</h1>
      <span>Todos os pedidos, sem restrição.</span>
    </div>
  </div>
  <notification></notification>
</div>
