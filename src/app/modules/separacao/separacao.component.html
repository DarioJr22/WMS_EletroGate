<div class="card">
  <h3>Separação</h3>
  <hr />

  <p-table [value]="dados" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Id</th>
        <th>Data</th>
        <th>Loja</th>
        <th>Cliente</th>
        <th>Situação</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.data | date : "dd/MM/yyyy" }}</td>
        <td>{{ item.loja ? item.loja.id : "" }}</td>
        <td>{{ item.contato.nome }}</td>
        <td>{{ item.situacao.id }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
