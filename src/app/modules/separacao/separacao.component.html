<div class="padding-default">
  <div class="flex justify-content-between">
    <h1>Separação</h1>
    <p-button
      label="Voltar"
      [outlined]="true"
      [routerLink]="['/opcoes']"
    ></p-button>
  </div>
  <hr />
  <div class="card">
    <div class="grid">
      <div class="col-4">
        <div class="card flex justify-content-center">
          <p-chart type="doughnut" [data]="data" [options]="options"></p-chart>
        </div>
      </div>
      <div class="col-8">
        <form [formGroup]="form">
          <div class="grid">
            <div class="col-6">
              <div class="flex flex-column gap-2">
                <label for="username">Nº do Cliente</label>
                <input
                  pInputText
                  formControlName="numCliente"
                  id="username"
                  aria-describedby="username-help"
                />
              </div>
            </div>
            <div class="col-6">
              <div class="flex flex-column gap-2">
                <label for="username">Nº do Pedido</label>
                <input
                  pInputText
                  formControlName="numPedido"
                  id="username"
                  aria-describedby="username-help"
                />
              </div>
            </div>
            <div class="col-6">
              <div class="flex flex-column gap-2">
                <label for="username">Nº do Pedido - Loja Virtual</label>
                <input
                  pInputText
                  formControlName="numPedidoLojaVirtual"
                  id="username"
                  aria-describedby="username-help"
                />
              </div>
            </div>
            <div class="col-6">
              <div class="flex flex-column gap-2">
                <label for="username">Nº da Nota Fiscal</label>
                <input
                  pInputText
                  formControlName="numNotaFiscal"
                  id="username"
                  aria-describedby="username-help"
                />
              </div>
            </div>
          </div>
        </form>
        <div class="flex justify-content-end mt-2">
          <p-button
            label="Limpar"
            [outlined]="true"
            severity="danger"
          ></p-button>
          <p-button
            class="ml-3"
            label="Pesquisar"
            (click)="getPedidosDetalhe()"
          ></p-button>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <p-table [value]="dados" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Data</th>
          <th>Loja</th>
          <th>Cliente</th>
          <th>Situação</th>
          <th>Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.data | date : "dd/MM/yyyy" }}</td>
          <td>{{ item.loja ? item.loja.id : "" }}</td>
          <td>{{ item.contato.nome }}</td>
          <td>{{ item.situacao.id }}</td>
          <td>
            <p-button
              icon="pi pi-check"
              [rounded]="true"
              [outlined]="true"
            ></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
