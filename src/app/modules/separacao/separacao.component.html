
<table style="border: 1px;">
  <tr>
    <th>Id</th>
    <th>Data</th>
    <th>Loja</th>
    <th>Cliente</th>
    <th>Situação</th>
  </tr>
  <tr *ngFor="let item of dados">
    <td>{{item.id}}</td>
    <td>{{item.data}}</td>
    <td>{{item.loja}}</td>
    <td>{{item.contato.nome}}</td>
    <td>{{item.situacao.id}}</td>
  </tr>

</table>
